[package]
name = "frob-cert"
version = "0.0.1"
edition = "2024"
publish = false
description = "Independent std-only certificate auditor and frob-verify CLI for FrankenRobotics (BD-026)"

[lib]
name = "frob_cert"
path = "src/lib.rs"

[[bin]]
name = "frob-verify"
path = "src/bin/frob-verify.rs"

[dependencies]

[dev-dependencies]

[features]
# Negative-control mutation harness flags (BD-026 / N38b-04).
# Never enabled in release builds or without `gauntlet-mutations` (enforced by compile_error!).
gauntlet-mutations = []
nc-skip-key-order = []
nc-interval-mul-nearest = []
nc-dup-key-first-wins = []
