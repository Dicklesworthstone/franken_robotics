[package]
name = "frob-conformance"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autobins = false
description = "Gauntlet verification harness, negative-control registry, and end-to-end log tooling for FrankenRobotics."

[package.metadata.frob]
layer = 7
rank = 4

[lib]
name = "frob_conformance"
path = "src/lib.rs"

[[bin]]
name = "frob-e2e"
path = "src/bin/frob-e2e.rs"

[[bin]]
name = "frob-tenfold"
path = "src/bin/frob-tenfold.rs"

[[bin]]
name = "frob-tenfold-score"
path = "src/bin/frob-tenfold-score.rs"

[[example]]
name = "admission"
path = "examples/admission.rs"

[[example]]
name = "evidence_ledger"
path = "examples/evidence_ledger.rs"

[[example]]
name = "pilots"
path = "examples/pilots.rs"

[[example]]
name = "validate_register"
path = "examples/validate_register.rs"

[[test]]
name = "g0_laws"
path = "tests/g0_laws.rs"
harness = false

[[test]]
name = "g1_known_answers"
path = "tests/g1_known_answers.rs"
harness = false

[[test]]
name = "g2_parity"
path = "tests/g2_parity.rs"
harness = false

[[test]]
name = "g3_metamorphic"
path = "tests/g3_metamorphic.rs"
harness = false

[[test]]
name = "g4_chaos"
path = "tests/g4_chaos.rs"
harness = false

[[test]]
name = "g5_determinism"
path = "tests/g5_determinism.rs"
harness = false

[features]
default = []
# Umbrella for workspace crate conformance facilities (BD-025 / ADR-GAUNT-03).
# Forbidden in release builds (enforced by compile_error!).
# Never lists per-control mutation features (`cx-*`, `nc-*`).
gauntlet-mutations = []
# Conformance-only mutation guard (N38b-04): implies `gauntlet-mutations` and is
# refused in release builds (`not(debug_assertions)`).
conformance = ["gauntlet-mutations"]
# M0 host stand-in mutation for NC-0412 (CX-262: explicit Euler, current before
# wheel speed, at 0.5 ms). Never a default and never listed in `gauntlet-mutations`.
cx-262 = ["conformance"]
# Test-only mutant for N12-41: substitutes -ad_xi^T for ad*_xi in compendium::d1::ad_star.
# Never a default and never listed inside `gauntlet-mutations`; implies `gauntlet-mutations`
# so release builds refuse it.
plant-coadjoint-minus = ["gauntlet-mutations"]
# Optional GPU device annexes; G0 and host G1 build with neither enabled.
cuda = []
metal = []

[dependencies]
frob-cert = { path = "../frob-cert" }
frob-core = { path = "../frob-core", features = ["test-support"] }

[lints]
workspace = true
