# Hypothesis verdict register and open disagreements (schema frob.hypothesis/1).
# Rules and wording lint owned by N00-10; row audit and arithmetic owned by N00-11 (H-01..H-12b) and N00-12 (H-13..H-29).
# Append-only: history entries are never edited or removed; REFUTED rows with only reversal_proposed cannot move until an owner decision sets reversal.

schema = "frob.hypothesis/1"

[[hypothesis]]
id = "H-01"
statement = "Sampling control with zero training"
state = "NARROWED"
survives = "A screening rung and an out-of-distribution fallback, at about 0.3-1 GPU-minute per quadruped episode and 1-5 per humanoid episode: cheaper than one training run up to about 30 episodes per quadruped design and 60 per humanoid design at a 20 ms planning step (6 and 12 at 4 ms). Published successes are legged robots with hand-built swing or stepping references; there is no success rate over a varied corpus and nothing for tracked robots. Never stands in for a trained policy as acceptance evidence. Where the sampling controller is itself the delivered controller, its own episodes are the evidence; break-even against training once is 2.0 GPU-seconds per 20 s episode for a quadruped and 12 for a humanoid, which published settings miss by 10x and 5x."
binds = ["BET-27", "BET-06"]
banned = ["no training needed", "zero-training control", "sampling[- ]controller episodes? (as|cited as|stand in for) acceptance evidence"]
settled_by = ["BET-27"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "primary-source cost comparison and break-even recomputation", kind = "primary-source-reread" },
]

[[hypothesis]]
id = "H-02"
statement = "A universal policy prior"
state = "NARROWED"
survives = "Within one morphology class, on flat or mildly varied ground with fixed actuation: zero-shot at 70-85% of specialist return; fine-tuning at about 2-25% of a from-scratch run stopped at matched return (1-10% against the fixed budget one source used). Across topology-diverse designs at affordable pretraining: zero-shot at 10-40%, a fine-tuning gain of 2-3x at best and none on flat ground. Within a class on interior terrain, with payload or actuator-card changes: no published figure."
binds = ["BET-15"]
banned = ["universal policy", "one policy for all morphologies"]
settled_by = ["BET-15"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "primary-source review of cross-morphology policy transfer", kind = "primary-source-reread" },
]

[[hypothesis]]
id = "H-03"
statement = "Topology as data"
state = "NARROWED"
survives = "Mixed-topology populations with few worlds per design, in size buckets. One incumbent solver publishes a mixed batch of three body plans at 0.86 of the harmonic mean of its homogeneous rates; that solver is maximal-coordinate, not deterministic, and slower than reduced-coordinate solvers of its framework. Three differentiators remain: measured mixed-batch throughput, time from an edit to the first GPU step, and run-to-run replay and forks inside a mixed batch."
binds = ["BET-18"]
banned = ["mixed topologies in one batch.*(first|incumbent gap)"]
settled_by = ["BET-18"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "incumbent mixed-batch benchmark and documentation reread", kind = "primary-source-reread" },
]

[[hypothesis]]
id = "H-04"
statement = "Supercompiled kernels"
state = "REFUTED"
scope = "recursion-only specialization"
survives = "The Lie-algebraic recursions are 16-20% of two incumbent step traces, so the ceiling is about 1.2x and reaching it needs the recursions more than five times faster. Derived derivative kernels for CPU solvers survive."
binds = ["BET-01", "KILL-SPECIALIZE", "GATE-SPARK-14"]
reversal = "a specializable share of at least one third on our own profile"
banned = ["per-design kernel specialization (as|is) (the )?default", "per-design kernel specialization.*throughput lever", "supercompiled kernels? (as|is) (the )?(default|goal|lever)"]
settled_by = ["GATE-SPARK-14"]
history = [
  { date = "2026-11-21", state = "REFUTED", evidence = "arithmetic on two incumbent step traces (16-20% recursion share)", kind = "recomputation" },
]

[[hypothesis]]
id = "H-04b"
statement = "Structure-exploiting constraint assembly and solve"
state = "ACTIVE"
survives = "Constraint assembly and the solve are 62% of the same incumbent trace: a ceiling of 2.6x if both vanished and 1.7x at a three-fold reduction. Ancestor-sparse rows and a tree-ordered factor cut operation counts 2.6x to 4.1x for the factor and 3.8x to 8.1x per foot row. Shares inside the solve stage are unmeasured, fewer operations do not imply a faster device step, and sparsity is carried as data rather than compiled per design."
binds = ["GATE-SPARK-15", "KILL-SPARSE-SOLVE", "BET-01"]
banned = []
settled_by = ["GATE-SPARK-15"]
history = [
  { date = "2026-11-21", state = "ACTIVE", evidence = "incumbent trace share 0.62 and tree-factor operation-count calculation", kind = "recomputation" },
]

[[hypothesis]]
id = "H-05"
statement = "Gait continuation"
state = "NARROWED"
survives = "Full-order orbit solves take about 4-260 s of CPU at 20-68 states: a screening signal for periodic gaits on regular ground, at about 1% to 63% of a 410 s training run. Not a referee-ready controller."
binds = ["BET-26"]
banned = []
settled_by = ["BET-26"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "orbit-solve CPU timing against 410 s training run", kind = "primary-source-reread" },
]

[[hypothesis]]
id = "H-06"
statement = "Region certificates"
state = "NARROWED"
survives = "Certificates per constraint. Bisection is confined to a split set of about six sensitive parameters; others are enclosed at full range, and a box of any dimension is admitted when that enclosure is narrower than the constraint margin. Isotropic paving of a 10-20 dimensional box is out of reach; whether robot constraints have narrow weak-variable enclosures is unmeasured."
binds = ["BET-20"]
banned = []
settled_by = ["BET-20"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "dimensional scaling analysis of isotropic paving vs six-parameter split sets", kind = "recomputation" },
]

[[hypothesis]]
id = "H-07"
statement = "A rare-event engine"
state = "NARROWED"
survives = "Search finds failures; a bound comes from a proposal frozen before confirming draws with bounded weights, or from crude sampling. Published measured gains are 2-20x and about 5x in mean-square error; 10-100x at 1e-4 to 1e-5 is a TARGET. Proposals may act on static scene parameters as well as per-step disturbances; a failure mode the proposal misses costs up to 1/epsilon times crude sampling, so absence is never certified more cheaply."
binds = ["BET-32"]
banned = []
settled_by = ["BET-32"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "importance-sampling weight-bound analysis and primary-source gains", kind = "primary-source-reread" },
]

[[hypothesis]]
id = "H-08"
statement = "Counterfactual autopsy"
state = "NARROWED"
survives = "Interventional contrasts reported with a flip rate under perturbations at or above round-off scale. Temporary interventions fork from the snapshot; design-parameter interventions re-run from the episode start. Single-precision round-off stays below 4e-5 of state scale over fork windows up to about 1 s and reaches 2% at 2 s; double precision is the default for one failure and escalation for marginal cases."
binds = ["BET-23"]
banned = []
settled_by = ["BET-23"]
history = [
  { date = "2026-11-21", state = "NARROWED", evidence = "round-off divergence computation across 1 s and 2 s fork windows", kind = "recomputation" },
]

[[hypothesis]]
id = "H-09"
statement = "Incremental evaluation"
state = "REFUTED"
scope = "exact reuse"
survives = "Exact reuse of rollouts after a mass or geometry edit is at most about 10% of compute. Training avoided by warm starts belongs to H-21 and is counted once. A memo graph for analyses, step plans, kernels and scene compiles survives as hygiene; dependency-directed revalidation of verdicts survives as an evidence rule."
binds = ["BET-33"]
reversal_proposed = "reopened only by a measurement showing exact reuse above 10% of compute"
banned = ["incremental re-simulation", "rollout reuse across edits.*speed lever"]
settled_by = ["BET-33"]
history = [
  { date = "2026-11-21", state = "REFUTED", evidence = "exact rollout reuse ceiling <= 10% after mass or geometry edit", kind = "recomputation" },
]

