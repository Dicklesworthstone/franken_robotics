survives = "No published rank agreement between a shared policy and specialists was found; the nearest figure (0.40) compares a critic with its own policy. High rank correlation does not protect the winner: with 40 designs and the true best at cheap rank 3, Kendall tau is 0.91 on the top ten yet a cut to two discards it."
