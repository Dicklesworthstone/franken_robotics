# FrankenRobotics seed list of pilots still to run (N38a-09, §38.5).
#
# Each row names an upper-tier mechanism known at plan conversion, its kill
# gate, its falsifier threshold where stated, and its canonical pilot
# identifier where the owning pilot bead names one. `pilots::complete()`
# reports every row of this list that does not yet have a record in
# `crates/frob-conformance/registry/pilots.toml`.
# Written strictly in the `frob-core::registry::toml` subset.

schema = "frob.gauntlet.pilots_expected/1"

