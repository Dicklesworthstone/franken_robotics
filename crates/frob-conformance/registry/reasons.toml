kind = "flag"

[[reason]]
id = "relation-without-control"
tool = ["control-loader", "relation-registry", "N38a-14"]
meaning = "A metamorphic relation has no mutation control in `controls.toml` (the map relation <-> control is one-to-one)"
repairs = ["Register the relation's mutation as a control in `controls.toml`"]
exit = 101

[[reason]]
id = "control-without-relation"
tool = ["control-loader", "relation-registry", "N38a-14"]
meaning = "A mutation control references a metamorphic relation that is gone (the map relation <-> control is one-to-one)"
repairs = ["Withdraw the control with a recorded reason", "Restore the metamorphic relation"]
exit = 101

[[reason]]
id = "mutation-survived"
tool = ["g3-runner", "N38a-14", "N38a-19"]
meaning = "A metamorphic relation's mutant produced no violation in the scenarios tried (count reported)"
repairs = ["Strengthen the relation's test", "Re-state the mutation"]
exit = 101

[[reason]]
id = "mutation-stale"
tool = ["g3-runner", "N38a-14", "N38a-19"]
meaning = "A metamorphic relation's mutation cannot be planted as described because the code path no longer exists; never counted as caught and reviewed at the milestone exit"
repairs = ["Re-state the mutation at the current code path; never drop it"]
exit = 101

[[reason]]
id = "due-unbound"
tool = ["g3-binding-check", "tier-matrix-check", "N38a-15", "N38a-16", "N38a-17", "N38a-18", "N38a-19", "N38a-03"]
meaning = "A metamorphic relation due at the current milestone has no runner entry on a site it lists, or a due cell of the tier matrix has no runner entry"
