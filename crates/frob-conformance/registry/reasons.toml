meaning = "A generated status view differs from the committed file"
repairs = ["Regenerate the status views from `registries/gates.toml`; never edit by hand"]
exit = 101

# ---------------------------------------------------------------------------
# 9. Emitting-bead reasons after `reduced-not-recordable` (23 reasons)
# ---------------------------------------------------------------------------

[[reason]]
id = "claim-evidence-mismatch"
tool = ["recorder", "N38a-05"]
meaning = "A row's claim kind is stronger than the kind its evidence can carry: a `reality` row whose evidence includes a `ParityResult` of any status; nothing written"
repairs = ["Record the row with claim `parity`", "Cite evidence of the claimed kind", "Leave the gate `not-run`"]
exit = 3

[[reason]]
id = "no-potency-record"
tool = ["recorder", "N38a-36"]
meaning = "An analysis, screen, or attribution method is cited with no potency record, or with one made under a stale corpus version; nothing written"
repairs = ["Run the potency check on the current corpus", "Cite a different potent method"]
exit = 3

[[reason]]
id = "not-potent"
tool = ["recorder", "N38a-36"]
meaning = "The cited method's current potency record has the verdict `not-potent`; nothing written"
repairs = ["Improve the method and re-run it on the held-out half", "Leave the gate `not-run`"]
exit = 3

[[reason]]
id = "origin-label-mismatch"
tool = ["recorder", "N38b-07", "N38b-19"]
meaning = "The claim product recomputed from an evidence item's inputs carries `origin-synthetic` or `origin-development-oracle` and the presented evidence block does not (the recorder's form of FROB-REF-819); nothing written, `gates.toml` byte-identical"
repairs = ["Cite the receipt as it was produced, with its origin labels", "Re-run on the real tier"]
exit = 3

[[reason]]
id = "origin-not-admissible"
tool = ["recorder", "N38b-07", "N38b-19"]
meaning = "An evidence item carries `origin-development-oracle` (for any gate), or carries `origin-synthetic` for a gate whose claim is `reality`; nothing written"
repairs = ["Re-run on the CPU referee", "Record a claim other than `reality`"]
exit = 3

[[reason]]
id = "ka-second-file"
tool = ["known-answer-loader", "N38a-12"]
meaning = "A file other than `known_answers.toml` matches `known_answers*.toml` or `known-answers*.toml`, or is a `.toml` file under a directory named `known_answers` or `known-answers`"
repairs = ["Move its rows into the single canonical `known_answers.toml` file", "Remove the second file"]
exit = 101

[[reason]]
id = "boundary-only"
tool = ["known-answer-loader", "N38a-12"]
meaning = "A known-answer row whose `control.text` only restates a refusal at a limit; the load does not fail (exit 0) and the row stays `obligation: control`"
repairs = ["Name the build or input in which the limit was removed and register it as the row's control"]
