[[reason]]
id = "unexpected-owner"
tool = ["pilot-ledger-check", "N38a-10"]
meaning = "A pilot record names a re-run owner the plan-time pilot ledger does not give it (rows 19 and 20 name N38a-11 only)"
repairs = ["Keep the owners the ledger names", "Remove the extra owner"]
exit = 101

[[reason]]
id = "unallocated-number"
tool = ["allocation-validator", "N38a-40"]
meaning = "A KA or CX number above the plan-time maximum that lies in no block, or in a block owned by another bead's chapter"
repairs = ["Request a block in `allocations.toml` and take the number from it; never type an unallocated number"]
