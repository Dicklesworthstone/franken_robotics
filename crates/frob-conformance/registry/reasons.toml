# FrankenRobotics Gauntlet harness refusal vocabulary (schema frob.gauntlet.reasons/1).
#
# Owned by N38-REF (`frob-n38-ref-cnru`, §38.10-§38.14, Appendix O, ADR-GAUNT-01).
# Written strictly in the `frob-core::registry::toml` subset (`N34p2-01`).
#
# By decision (`ADR-GAUNT-01`), `frob-conformance` exposes no agent verb and defines
# zero public `FROB-REF-nnn` refusal codes. Every Gauntlet harness refusal reason is
# closed in this file and mirrored 1-to-1 by `frob_conformance::reasons::HarnessReason`.
#
# Exit convention (N38-REF):
# - 101: Cargo test targets (`reason=<id>` on the first failure line)
# -   3: Refused requests from example/CLI tools (`record_gate`, `validate_register`,
#        `pilots` status change, `moonshot enter`)
# -   0: Warnings (`burst`), flags (`boundary-only`), seeding findings (`plant-changed`),
#        non-blocking control-runner / gate-line outcomes (`not-yet-due`, `not-eligible`),
#        and funding-check query answers (`Blocked{<reason>}`)
# - Exit code 1 is NEVER emitted on purpose anywhere in the program.
#
# Review notes applied (polishing round 4):
# - Note 6 (F-U38b): registered `export-format-unreadable` (close-audit, N38b-03, exit 101)
#   and `not-yet-due` (control-runner, N38b-04, exit 0).
# - Note 7 (F-U41): added `moonshot-transition` / `N41-09` to `moonshot-cap`'s tool list.

schema = "frob.gauntlet.reasons/1"

# ---------------------------------------------------------------------------
# 1. Registry check (4 reasons, exit 101)
# ---------------------------------------------------------------------------

[[reason]]
id = "no-control"
tool = ["registry-check", "BD-025"]
meaning = "A gate with status `pass` and an empty control list (or no due runnable control)"
repairs = ["Register a control first", "Set the gate back to `not-run`"]
exit = 101

[[reason]]
id = "dangling-control"
tool = ["registry-check", "BD-025"]
meaning = "A gate lists a control identifier that does not exist in `controls.toml`"
repairs = ["Fix the identifier", "Add the missing control record"]
exit = 101

[[reason]]
id = "one-way-link"
tool = ["registry-check", "BD-025"]
meaning = "A gate lists a control that does not name the gate, or the reverse"
repairs = ["Add the missing direction of the gate-control link"]
exit = 101

[[reason]]
id = "uncaught-control"
tool = ["registry-check", "BD-025"]
meaning = "A `pass` row whose control's last recorded outcome is not caught"
repairs = ["Re-run the gate with its controls", "Fix the test or the plant"]
exit = 101

# ---------------------------------------------------------------------------
# 2. Control loader (10 reasons here; 4 append-only reasons shared in §6)
# ---------------------------------------------------------------------------

[[reason]]
id = "no-gate"
tool = ["control-loader", "BD-025"]
meaning = "A control with an empty `gate` list"
repairs = ["Name at least one existing gate", "Register the gate in `registries/gates.toml` first"]
exit = 101

[[reason]]
id = "unknown-gate"
tool = ["control-loader", "BD-025"]
meaning = "A control naming a gate absent from `registries/gates.toml`"
repairs = ["Name at least one existing gate", "Register the gate in `registries/gates.toml` first"]
exit = 101

[[reason]]
id = "kind-not-closed"
tool = ["control-loader", "BD-025"]
meaning = "A control whose `kind` is not one of `mutation`, `planted-input`, `planted-design`, `planted-world`, `a-a`"
repairs = ["Choose one of the five admitted control kinds"]
exit = 101

[[reason]]
id = "defect-or-expect-empty"
tool = ["control-loader", "BD-025"]
meaning = "A control whose `defect` or `expect` is empty, or whose `expect` states no observable (a value, a refusal code, or a failed row)"
repairs = ["State the planted defect", "State the observable the gate must show when it catches it (the value, the refusal code, or the failed row)"]
exit = 101

[[reason]]
id = "feature-missing"
tool = ["control-loader", "BD-025"]
meaning = "A `mutation` control naming no feature declared in its target crate"
repairs = ["Declare the mutation feature in the target crate's Cargo.toml", "Point the control at the declared feature name"]
exit = 101

[[reason]]
id = "fixture-missing"
tool = ["control-loader", "BD-025"]
meaning = "A non-mutation control naming no existing fixture with its required `synthetic` kind header"
repairs = ["Add the fixture file with its `synthetic` header", "Correct the fixture path on the control record"]
exit = 101

[[reason]]
id = "unknown-seed-form"
tool = ["control-loader", "BD-025"]
meaning = "A `seed` outside the admitted forms (CX, KA, MR, CERT, INV, PO, RISK, SAFE-X, GATE, or empty on a permanent control)"
repairs = ["Seed the control from its catalogue entry, row, or rule"]
exit = 101

[[reason]]
id = "boundary-not-control"
tool = ["control-loader", "BD-025"]
meaning = "A control whose defect is the product's own refusal at a limit without naming `removed_check`"
repairs = ["Name the build or input in which the limit was removed (`removed_check`)"]
exit = 101

[[reason]]
id = "cannot-fail"
tool = ["control-loader"]
meaning = "A control whose planted value lies on the safe side of its row"
repairs = ["Choose a defect that errs in the unsafe direction"]
exit = 101

[[reason]]
id = "permanent-control-removed"
tool = ["control-loader"]
meaning = "A permanent control deleted or detached from a gate"
repairs = ["Restore the permanent control and its gate link"]
exit = 101

# ---------------------------------------------------------------------------
# 3. Control runner, tier runner, and control review (6 reasons)
# ---------------------------------------------------------------------------

[[reason]]
id = "missed"
tool = ["control-runner", "N38b-04"]
meaning = "The gate's entries pass with the defect planted"
repairs = ["Strengthen the gate's test", "Re-state the defect so the gate observes it"]
exit = 101

[[reason]]
id = "caught-unexpected"
tool = ["control-runner", "N38b-04"]
meaning = "The gate fails for a reason other than the control's stated expectation"
repairs = ["Correct the control's stated expectation", "Correct the planted defect"]
exit = 101

[[reason]]
id = "stale"
tool = ["control-runner", "N38b-04"]
meaning = "The defect cannot be planted because its feature or fixture is gone"
repairs = ["Re-plant the control on the current target", "Withdraw the control with a recorded reason"]
exit = 101

[[reason]]
id = "not-yet-due"
tool = ["control-runner", "N38b-04"]
meaning = "A control-runner outcome (beside `missed` and `stale`) for a control whose `due` is later than the milestone of the part being run; it neither blocks nor supports that part"
repairs = ["Build the plant by its due milestone"]
exit = 0
kind = "outcome"

[[reason]]
id = "not-eligible"
tool = ["tier-runner", "gate-line", "registry-check", "BD-025", "N38a-02"]
meaning = "No control caught in this run, or a declared dependency without a live-dependency proof"
repairs = ["Run the gate's controls in the same run", "Add the live-dependency proof"]
exit = 0
kind = "outcome"

[[reason]]
id = "suspect-undisposed"
tool = ["control-review", "N38b-04"]
meaning = "A control never caught in recorded history with no disposition at a milestone exit"
repairs = ["Record a disposition of `replanted`, `gate-strengthened`, or `withdrawn`"]
exit = 101
dispositions = ["replanted", "gate-strengthened", "withdrawn"]

# ---------------------------------------------------------------------------
# 4. Gate recorder (15 core reasons here + 5 emitting-bead recorder reasons in §9)
# ---------------------------------------------------------------------------

[[reason]]
id = "receipt-hash-mismatch"
tool = ["recorder", "N38b-19"]
meaning = "The receipt's bytes do not hash to its content-addressed filename or embedded hash"
repairs = ["Re-run the tier on a clean, known commit and commit the exact receipt bytes"]
exit = 3

[[reason]]
id = "receipt-dirty-tree"
tool = ["recorder", "N38b-19"]
meaning = "The receipt was produced from a dirty working tree and cannot be trusted for recording"
repairs = ["Re-run the tier on a clean, known commit"]
exit = 3

[[reason]]
id = "receipt-commit-unknown"
tool = ["recorder", "N38b-19"]
meaning = "The receipt's commit cannot be resolved in the repository history"
repairs = ["Re-run the tier on a clean, known commit"]
exit = 3

[[reason]]
id = "gate-line-not-eligible"
tool = ["recorder", "N38b-19"]
meaning = "The receipt's line for the gate is not `pass` or `fail`"
repairs = ["Run the gate's controls in the same run so the gate line is eligible"]
exit = 3

[[reason]]
id = "pass-without-control"
tool = ["recorder", "gate-register-validator", "N38b-19", "N40-01"]
meaning = "The same-run rule is not met: a `pass` is offered for a gate with no registered control"
repairs = ["Register and run the control with the gate in the same run"]
exit = 3
alt_exits = [101]

[[reason]]
id = "control-missing-from-receipt"
tool = ["recorder", "N38b-19"]
meaning = "The same-run rule is not met: a required due control is absent from the receipt"
repairs = ["Register and run the control with the gate in the same run"]
exit = 3

[[reason]]
id = "control-not-caught"
tool = ["recorder", "gate-register-validator", "N38b-19", "N40-01"]
meaning = "The same-run rule is not met: a listed control was not caught in the same run"
repairs = ["Register and run the control with the gate until it is caught in the same run"]
exit = 3
alt_exits = [101]

[[reason]]
id = "self-certified"
tool = ["recorder", "gate-register-validator", "N38b-19", "N40-01"]
meaning = "The recording session implemented the capability (`recorded.session` is in `recorded.implemented_by`)"
repairs = ["Record the gate from a fresh-context session that did not implement the capability"]
exit = 3
alt_exits = [101]

[[reason]]
id = "evidence-unresolved"
tool = ["recorder", "gate-register-validator", "N38b-19", "N40-01"]
meaning = "An evidence item or claim identifier dangles or is tombstoned in the artifact graph"
repairs = ["Cite a live, committed receipt", "Re-run the tier and record with resolving evidence"]
exit = 3
alt_exits = [101]

[[reason]]
id = "receipt-stack-dev"
tool = ["recorder", "N38b-19"]
meaning = "A receipt whose `stack_dev` is true (a result of a development stack identity), whatever its line's status"
repairs = ["Re-run the tier from a binary built under a clean stack receipt"]
exit = 3

[[reason]]
id = "dev-build-identity"
tool = ["recorder", "N38b-19"]
meaning = "`may_cite(gate_class)` of N33a-08, called on the receipt's `build_identity`, refuses a `pass` of a Performance or Parity gate from a binary in mode `dev-salt` (a `fail` is recorded)"
repairs = ["Rebuild under `depgraph-receipt` and re-run", "Record the measured value without citing it as a pass"]
exit = 3

[[reason]]
id = "receipt-set-invalid"
tool = ["recorder", "N38b-19"]
meaning = "Two receipts of one tier, or receipts of two commits, supplied in one recording (the tier or commits named)"
repairs = ["Give one receipt per tier, all from one commit"]
exit = 3

[[reason]]
id = "part-rows-dropped"
tool = ["recorder", "N38b-19"]
meaning = "A re-recording whose receipts omit an entry that the replaced recording measured and that is still registered (the entry named)"
repairs = ["Add the receipt of the dropped entry's tier"]
exit = 3

[[reason]]
id = "receipt-not-of-record"
tool = ["recorder", "N38b-19", "N32ax-03"]
meaning = "An evidence receipt that fails `frob_core::registries::assert_of_record` (made under a scratch or snapshot registry root, or with a run-time registry in its fail-closed reading); nothing written"
repairs = ["Re-run under the registries of record"]
exit = 3

[[reason]]
id = "reduced-not-recordable"
tool = ["recorder", "N38b-19"]
meaning = "A reduced-count receipt offered for a full-count threshold"
repairs = ["Run the full count", "Record the reduced value only as measured without claiming pass"]
exit = 3

