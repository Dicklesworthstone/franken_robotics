# ---------------------------------------------------------------------------
# 6. Registry diff (5 reasons, exit 101; shared with control-loader and pilot-loader)
# ---------------------------------------------------------------------------

[[reason]]
id = "removed"
tool = ["registry-diff", "control-loader", "pilot-loader", "BD-025", "N38a-09"]
meaning = "An append-only identifier was removed from a registry family"
repairs = ["Restore the removed identifier", "Append a new record instead of deleting an existing one"]
exit = 101

[[reason]]
id = "reused"
tool = ["registry-diff", "control-loader", "pilot-loader", "BD-025", "N38a-09"]
meaning = "An append-only identifier was duplicated or reused"
repairs = ["Restore the original identifier", "Append a fresh unused identifier instead"]
exit = 101

[[reason]]
id = "renumbered"
tool = ["registry-diff", "control-loader", "BD-025"]
meaning = "An existing identifier's immutable identity (seed, kind, or non-placeholder target) was changed"
repairs = ["Restore the identifier's original binding", "Append a new record instead"]
exit = 101

[[reason]]
id = "out-of-order"
tool = ["registry-diff", "control-loader", "BD-025"]
meaning = "An append-only identifier family is not in strictly increasing numeric order"
