exit = 101

[[reason]]
id = "gap"
tool = ["registry-diff"]
meaning = "An unrecorded numbering gap appears in an append-only identifier family"
repairs = ["Restore the missing identifier", "Append sequentially without leaving an unrecorded gap"]
exit = 101

# ---------------------------------------------------------------------------
# 7. Close audit (8 reasons: 7 failing exit 101 + 1 warning exit 0)
# ---------------------------------------------------------------------------

[[reason]]
id = "untyped"
tool = ["close-audit", "N38b-03"]
meaning = "A bead's close reason does not use a typed close-reason form"
repairs = ["Re-close with a typed reason and its own evidence"]
exit = 101

[[reason]]
id = "foreign-test"
tool = ["close-audit", "N38b-03"]
meaning = "A bead's close reason cites a test that does not belong to that bead"
repairs = ["Re-close citing the bead's own test and output from another session"]
exit = 101

[[reason]]
id = "no-output"
tool = ["close-audit", "N38b-03"]
meaning = "A bead's close reason cites no resolving test output"
repairs = ["Re-close with a typed reason and its own resolving test output"]
exit = 101

[[reason]]
id = "self-closed"
tool = ["close-audit", "N38b-03"]
meaning = "A bead was closed using output from the same session that implemented it"
repairs = ["Re-close using resolving output verified by another session"]
exit = 101

[[reason]]
id = "shared-reason"
tool = ["close-audit", "N38b-03"]
meaning = "Multiple beads share an identical close reason string"
repairs = ["Re-close each bead with its own typed reason and distinct evidence"]
exit = 101

[[reason]]
id = "shared-output"
tool = ["close-audit", "N38b-03"]
meaning = "Multiple beads share identical cited test output"
repairs = ["Re-close each bead with its own test run and resolving output"]
exit = 101

[[reason]]
id = "burst"
tool = ["close-audit", "N38b-03"]
meaning = "More than 5 closes by one session in 60 seconds (warning)"
repairs = ["Record a written disposition by the exit reviewer"]
exit = 0
kind = "warning"

[[reason]]
id = "export-format-unreadable"
tool = ["close-audit", "N38b-03"]
meaning = "The tracker export lacks or renames a field that N38b-03's close audit reads"
repairs = ["Update the close audit to the tracker export's fields", "Regenerate the tracker export in the expected format"]
exit = 101

# ---------------------------------------------------------------------------
# 8. Live-dependency helper & status views (3 reasons, exit 101)
# ---------------------------------------------------------------------------

[[reason]]
id = "stand-in-suspected"
tool = ["live-dependency-helper", "N38b-06"]
meaning = "A perturbed declared input does not change the measured output"
repairs = ["Remove the stand-in or stub and wire the real dependency"]
exit = 101

[[reason]]
id = "unbound-dependency"
tool = ["live-dependency-helper", "N38b-06"]
meaning = "Perturbing an input changes the output without changing the bound identities in the envelope"
