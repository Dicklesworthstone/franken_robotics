[package]
name = "frob-core"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Core foundational types, identities, evidence/claim product, no-authorization flags, refusals, strict TOML-subset reader, closed SI qty surface, and test-support kit."

[package.metadata.frob]
layer = 0
rank = 1

[dependencies]
fs-blake3 = { path = "../../../frankensim/crates/fs-blake3" }
fs-qty = { path = "../../../frankensim/crates/fs-qty" }

[features]
default = []
test-support = []
gauntlet-mutations = []
dup-first-wins = []
dup-last-wins = []
skip-escape-decode = []

[[test]]
name = "testkit"
path = "tests/testkit.rs"
required-features = ["test-support"]

[lints]
workspace = true
