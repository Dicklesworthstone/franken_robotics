# Machine-readable crate contract for frob-core (BD-005, N34-08).

[crate]
name = "frob-core"
layer = 0
rank = 1
plane = "compute"
determinism = "D0"
evidence = "Estimated"
gates = []
refusals = ["FROB-REF-802", "FROB-REF-816", "FROB-REF-881", "FROB-REF-890"]

[budgets]
wall_ms = 50
memory_mib = 64

[safe_mode]
on_budget = "reference-path"
on_calibration = "reference-path"

[features]
test-support = { tier = "S" }
gauntlet-mutations = { tier = "S" }
dup-first-wins = { tier = "S" }
dup-last-wins = { tier = "S" }
skip-escape-decode = { tier = "S" }
writer-no-key-sort = { tier = "S" }
identity-on-raw-bytes = { tier = "S" }
utf16-sort = { tier = "S" }
escape-all-non-ascii = { tier = "S" }
nc-torque-alias-first-moment = { tier = "S" }
nc-allow-empty-support = { tier = "S" }
nc-stack-compare-lock = { tier = "S" }

[api.float_ok]
"json::Json::as_f64_lexeme" = "dimensionless JSON binary64 accessor returning raw lexeme and rounded f64 per N34-17; physical quantities use qty or exact strings"
"json::Spanned::as_f64_lexeme" = "dimensionless JSON binary64 accessor delegating to json::Json::as_f64_lexeme per N34-17"
"canon::Value::f64_shortest" = "dimensionless canonical shortest round-trip binary64 encoder per N34-18 Rule 4; physical quantities use qty or exact rationals/decimals"
"canon::Object::f64_shortest" = "dimensionless canonical shortest round-trip binary64 object-member encoder delegating to canon::Value::f64_shortest per N34-18"
"canon::Array::push_f64_shortest" = "dimensionless canonical shortest round-trip binary64 array-element encoder delegating to canon::Value::f64_shortest per N34-18"
