[package]
name = "frob-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
frob-core = { path = ".." }

[features]
default = []
# Planted negative for N34-17 AC7: panics on a short input so the pinned fuzz
# lane's exit/output/artifact assertions are verified to catch a real crash.
planted-panic = []

[[bin]]
name = "admit"
path = "fuzz_targets/admit.rs"
test = false
doc = false
bench = false
