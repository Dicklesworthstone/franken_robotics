# Machine-readable crate contract for frob-fsim (BD-006, N33a-11, N34-08).
# The `[features.*]` records are the single data authority for airlock group
# allow-lists, default membership, crates, traits, milestones, and admission gates
# (read by `xtask check-deps` in N34-03/N33b-09 and `frob capabilities` in N33c-32).
# Non-group features (`mode-inproc`, `mode-remote`, `conformance`) are intentionally
# absent from `[features]` (N33a-11).

[crate]
name = "frob-fsim"
layer = 0
rank = 2
plane = "compute"
determinism = "D0"
evidence = "Tested"
gates = []
refusals = ["FROB-REF-790"]

[budgets]
wall_ms = 50
memory_mib = 64

[safe_mode]
on_budget = "reference-path"
on_calibration = "reference-path"

[features.referee]
tier = "S"
default = true
dev_only = false
traits = ["RefereeDynamics", "RefereeContact", "Integrator", "PortSystem"]
crates = ["fs-mbd", "fs-mbd-material", "fs-contact", "fs-tribo", "fs-time", "fs-motion", "fs-ports", "fs-system"]
consumers = ["frob-model", "frob-dyn", "frob-contact", "frob-analyze", "frob-verbs", "frob-conformance"]
test_consumers = ["frob-conformance"]
first_milestone = "M0"
gate = "INT-FSIM-01"

[features.geometry]
tier = "S"
default = true
dev_only = false
traits = ["GeometryKernel", "SceneQuery", "MeshExchange"]
crates = ["fs-query", "fs-geom", "fs-rep-sdf", "fs-rep-mesh", "fs-rep-frep", "fs-scene", "fs-topo", "fs-io"]
consumers = ["frob-contact", "frob-scene", "frob-foundry", "frob-conformance"]
test_consumers = ["frob-conformance"]
first_milestone = "M0"
gate = "INT-FSIM-01"

[features.ledger]
tier = "S"
default = true
dev_only = false
traits = ["Ledger", "Session", "Recompute"]
crates = ["fs-ledger", "fs-session", "fs-package", "fs-recompute"]
consumers = ["frob-chronicle", "frob-verbs"]
test_consumers = ["frob-conformance"]
first_milestone = "M0"
gate = "INT-FSQL-01"

[features.optimize]
tier = "S"
