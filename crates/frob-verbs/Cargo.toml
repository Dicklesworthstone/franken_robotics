[package]
name = "frob-verbs"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Verb registry (registries/verbs.toml), build-time static table, registry lints, and surface-shared definitions."

[package.metadata.frob]
layer = 6
rank = 4

[dependencies]
frob-core = { path = "../frob-core" }

[dev-dependencies]
frob-core = { path = "../frob-core", features = ["test-support"] }

[build-dependencies]
frob-core = { path = "../frob-core" }

[features]
default = ["handlers"]
registry-only = []
handlers = []
conformance = []
# Planted defects for GATE-TETHER-03's negative controls (N32a-03); never enabled in a build.
nc-bare-unknown-verb = []
nc-second-envelope = []

[lints]
workspace = true
