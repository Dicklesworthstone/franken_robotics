[package]
name = "frob-verbs"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Verb registry (registries/verbs.toml), build-time static table, registry lints, and surface-shared definitions."

[package.metadata.frob]
layer = 6
rank = 4

[dependencies]
frob-core = { path = "../frob-core" }

[dev-dependencies]
frob-core = { path = "../frob-core", features = ["test-support"] }

[build-dependencies]
frob-core = { path = "../frob-core" }

[features]
default = ["handlers"]
registry-only = []
handlers = []
conformance = []
# Planted defects for GATE-TETHER-03 and GATE-TETHER-02 negative controls (N32a-03, NJL-01); never enabled in a build.
gauntlet-mutations = []
nc-bare-unknown-verb = []
nc-second-envelope = []
nc-omit-805 = ["gauntlet-mutations"]
nc-key-in-required = ["gauntlet-mutations"]
nc-append-990 = ["gauntlet-mutations"]

[lints]
workspace = true
