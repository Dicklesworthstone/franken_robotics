[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Workspace verification tooling for FrankenRobotics (command surface, check-layers, and workspace tables)."

[package.metadata.frob]
layer = 7
rank = 5

[dependencies]
frob-core = { path = "../frob-core" }
frob-verbs = { path = "../frob-verbs", default-features = false, features = ["registry-only"] }
fs-blake3 = { path = "../../../frankensim/crates/fs-blake3", default-features = false }
semver = { version = "=1.0.28", default-features = false }
unicode-normalization = { version = "=0.1.26", default-features = false }

[dev-dependencies]
regex-lite = "=0.1.9"

[lints]
workspace = true
