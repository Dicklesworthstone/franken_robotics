note = "franken_numpy is an f64 array library on heap vectors with no single-precision storage and no fixed-size matrix types, and it lists GPU arrays and automatic differentiation as out of scope. It is the right tool at the interchange boundary and as an oracle, never in a hot path. Its stride convention differs from FrankenTorch (signed byte strides vs unsigned element strides), requiring a typed converter at the boundary (BD-036)."

