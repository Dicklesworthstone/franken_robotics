# Tether Architecture Decision Record index (schema frob.adr-index/1, bead N32a-01).
#
# Written strictly in the frob-core::registry::toml subset (N34p2-01).
# Records are never deleted: a changed decision transitions to status = "superseded"
# with a named `superseded_by` successor.
#
# Every `accepted` record must carry a non-empty `enforced_by` list. Each check entry
# is either `state = "active"` (must resolve to a live test, gate, or control today)
# or `state = "pending"` with a `milestone` no later than the record's own
# `first_milestone` and a named `owner_bead`.

schema = "frob.adr-index/1"
subsystem = "tether"
current_milestone = "M0"
principles_doc = "docs/adr/TETHER-PRINCIPLES.md"
ownership_doc = "docs/adr/TETHER-OWNERSHIP.md"

