# Mathematics compendium section D.3: Contact, wheels and terrain (bead N12-43).
#
# Exact mathematical formulas, validity domains, oracle entry points, law tests,
# and negative controls for Appendix D.3 and §10 (C-06, C-07, C-33, C-37),
# §18.8, §18.10, and §19.11.
# Validated by crates/frob-conformance/tests/compendium_registry.rs and rendered
# into docs/math/compendium.md by examples/compendium_doc.rs.

schema = "frob.compendium.section/1"
section = "D.3"
title = "Contact, wheels and terrain"
expected_rows = 10

[[row]]
name = "Friction cone"
statement = "𝒦_μ = {‖γₜ‖ ≤ μ·γₙ}; its dual is 𝒦_{1/μ}"
validity = "Isotropic; elliptic cones by a linear map. The box |γₜ₁|, |γₜ₂| ≤ μ·γₙ admits √2·μ·γₙ on the diagonals and is not used"
used_in = ["C-06", "T-07"]
oracle = "frob_conformance::compendium::d3::project_friction_cone_rational"
tests = ["d3_cone_duality", "d3_cone_projection_example"]
negative_control = "d3_box_admits_sqrt2"
carried_by = ["SPEC-C-06"]
arithmetic = "exact-rational"

[[row]]
name = "Spin-factor Jordan product"
statement = "(x₀, x̄) ∘ (y₀, ȳ) = (x₀·y₀ + x̄·ȳ, x₀·ȳ + y₀·x̄); eigenvalues x₀ ± ‖x̄‖"
validity = "The second-order cone is its cone of squares"
used_in = ["C-06"]
oracle = "frob_conformance::compendium::d3::jordan_product"
tests = ["d3_jordan_commutative_not_associative", "d3_jordan_identity", "d3_jordan_eigenvalues_and_membership"]
negative_control = "d3_nc_spin_factor_associativity"
carried_by = ["SPEC-C-06"]
arithmetic = "exact-rational"

[[row]]
name = "Fast-tier contact problem"
statement = "v = argmin ½·(v − v*)ᵀA(v − v*) + Σ_c ℓ_c(J_c·v), with γ_c = −∇ℓ_c"
validity = "ℓ_c convex, A positive definite; the Hessian is positive semidefinite by construction"
used_in = ["C-06", "§16.6", "T-08"]
oracle = "frob_conformance::compendium::d3::fast_tier_quadratic_minimizer"
tests = ["d3_fast_tier_one_contact_closed_form"]
negative_control = "d3_nc_fast_tier_nonconvex"
carried_by = ["SPEC-C-06"]
arithmetic = "exact-rational"

[[row]]
name = "Four-dimensional friction cone"
statement = "𝒦 = {‖(λ_t1, λ_t2, λ_s/r)‖ ≤ μ·λ_n}, with dual {μ·‖(v_t1, v_t2, r·ω_n)‖ ≤ v_n}; r = 2R/3 for uniform pressure on a disc of radius R and 3πR/16 for a Hertzian distribution"
validity = "An ellipsoidal approximation of the sliding–spinning law of a finite patch. At v_t = r·ω_n the tangential friction is μ·λ_n/√2"
used_in = ["C-37", "§18.6", "T-07"]
oracle = "frob_conformance::compendium::d3::cone4d_coupled_tangential_fraction"
tests = ["d3_4d_cone_coupling_value", "d3_pure_spin_moment_two_thirds", "d3_hertz_radius_3pi_over_16"]
negative_control = "d3_nc_4d_cone_uncoupled"
carried_by = ["SPEC-C-37"]
arithmetic = "tolerance"
tolerance = "1e-12"

[[row]]
name = "Joint-level rows"
statement = "Stiction: a row whose multiplier lies in [−τ_s, τ_s]. Backlash: −β/2 ≤ q_out − q_motor/N ≤ β/2, two unilateral rows with non-negative multipliers. Hard stop: one unilateral row"
validity = "Stribeck dependence enters as a parameter update between steps"
used_in = ["C-37", "§15.6", "§18.7"]
oracle = "frob_conformance::compendium::d3::stiction_breakaway_time"
tests = ["d3_stiction_breakaway_time", "d3_backlash_amplitude_and_width"]
negative_control = "d3_nc_joint_backlash_bilateral"
carried_by = ["SPEC-C-37"]
arithmetic = "exact-rational"

[[row]]
name = "Growth vector and cost"
statement = "A direction first reached at bracket depth w costs path length of order ε^(1/w) for a displacement ε; for a differential drive a lateral shift d costs about 4·√(d·b) of wheel travel with half-track b"
validity = "Regular points of a bracket-generating distribution with reversible inputs; a finite mission needs an integrated witness"
used_in = ["C-07", "GB-05"]
oracle = "frob_conformance::compendium::d3::diff_drive_lateral_shift_cost"
tests = ["d3_growth_vectors", "d3_lateral_shift_cost_scaling"]
negative_control = "d3_nc_growth_vector_nonreversible"
carried_by = ["SPEC-C-07"]
arithmetic = "tolerance"
tolerance = "1e-12 m"

[[row]]
name = "Squeeze film"
statement = "dh/dt = −2·N·h³/(3π·η·a⁴), so 1/h² − 1/h₀² = 4·N·t/(3π·η·a⁴); μ_eff = ψ·μ_b + (1 − ψ)·η·v·π·a²/(h·N) with ψ = 1 for h ≤ σ and ψ = 0 for h ≥ 3σ"
validity = "Stefan's law on a circular patch of radius a under load N; semi-empirical, Estimated; flagged outside the calibrated range of the Hersey number η·v/(p·a)"
used_in = ["§18.8"]
oracle = "frob_conformance::compendium::d3::squeeze_film_thickness"
tests = ["d3_squeeze_film_closed_form", "d3_squeeze_film_time_to_thickness"]
negative_control = "d3_nc_squeeze_film_euler"
carried_by = ["compendium-only"]
evidence_class = "Estimated"
arithmetic = "tolerance"
tolerance = "1e-9 m"

[[row]]
name = "Pressure–sinkage and shear"
statement = "p = (k_c/b + k_φ)·zⁿ; τ = (c + σ·tan φ)·(1 − e^(−j/K))"
validity = "Semi-empirical, Estimated; parameters from soil cards; oracle checks monotonicity, limits and dimensional homogeneity only"
used_in = ["§18.10"]
oracle = "frob_conformance::compendium::d3::bekker_pressure"
tests = ["d3_bekker_monotone", "d3_shear_limits"]
negative_control = "d3_nc_soil_dimensions_dropped"
carried_by = ["compendium-only"]
evidence_class = "Estimated"
arithmetic = "tolerance"
tolerance = "1e-9 Pa"

[[row]]
name = "Swept right-angle corner"
statement = "A thin rod of length L turns a right-angle corner between corridors of width a exactly when L ≤ 2√2·a"
validity = "The known answer that defeats any single clearance radius"
used_in = ["C-33", "§19.11"]
oracle = "frob_conformance::compendium::d3::right_angle_corner_max_rod"
tests = ["d3_corner_two_root_two"]
negative_control = "d3_nc_corner_single_disc"
carried_by = ["SPEC-C-33"]
arithmetic = "tolerance"
tolerance = "1e-12 m"

[[row]]
name = "Clearance sandwich"
statement = "𝒞_in ⊆ 𝒞_free ⊆ 𝒞_out; a path in 𝒞_in is a feasibility witness, disconnection in 𝒞_out an impossibility certificate; widths between the two critical widths are unknown"
validity = "Planar base in SE(2); the band follows from cell size and heading bin and is reported"
used_in = ["C-33", "§19.11", "T-31"]
oracle = "frob_conformance::compendium::d3::clearance_sandwich_doorway"
tests = ["d3_clearance_sandwich_doorway"]
negative_control = "d3_nc_clearance_sandwich_close_gap"
carried_by = ["SPEC-C-33"]
arithmetic = "tolerance"
tolerance = "1e-12 m"
