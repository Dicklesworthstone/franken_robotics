# FrankenRobotics artifact format registry (schema frob.formats/1).
#
# Registry rules (BD-002, ADR-WS-03):
#   1. One owner crate per format.
#   2. Identity is the BLAKE3 hash of canonical bytes under a domain string
#      equal to the schema name.
#   3. A reader refuses an unknown major version and an unknown required field.
#   4. Integers above 2^53 travel as strings.
#   5. Large payloads are blobs addressed by hash.
#   6. An exported artifact carries the three no-authorization flags:
#      execution_authorized = false, hardware_safety_signoff = false,
#      sim_to_real_certified = false.
#
# Written strictly in the frob-core::registry::toml subset (N34p2-01).

schema = "frob.formats/1"

[[format]]
id = "FMT-FBOT"
extension = ".fbot"
schema = "frob.design/1"
owner = "frob-design"
producers = ["frob-design"]
consumers = ["frob-design", "frob-model", "frob-analyze", "frob-arena", "frob-cli"]
encoding = "canonical"

