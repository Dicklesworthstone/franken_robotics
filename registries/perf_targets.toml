# FrankenRobotics performance target register (schema frob.perf.targets/1, bead N36-01).
#
# All 22 rows are TARGETs, not measurements. Every threshold carries an explicit
# status (`tolerance`, `interim-floor`, `ambition`, `planning-value`, or `reported-only`,
# ADR-PERF-03). Every step-family rate row carries an explicit decimation (ADR-PERF-02).
# Incumbent references are FACTs from Appendix H marked `to-re-read` until the parity
# baseline (GATE-SPARK-21, N36-29) replaces them with measured figures and disclosure IDs.
#
# Written strictly in the frob-core::registry::toml subset (N34p2-01): UTF-8, LF,
# basic double-quoted strings only, decimal values encoded as exact decimal strings
# (no TOML floats), homogeneous arrays, single-line inline tables without trailing commas,
# and no dotted keys on the left of `=`.

schema = "frob.perf.targets/1"

