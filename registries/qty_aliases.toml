# FrankenRobotics closed SI quantity alias registry (schema frob.qty_aliases/1, N33c-03).
# Starter alias set (36 <= 64, OPEN-SUITE-4). Generated into crates/frob-core/src/qty_gen.rs
# by `cargo xtask check-generated`. Dimension order matches fs-qty: [m, kg, s, K, A, mol].

schema = "frob.qty_aliases/1"

[[alias]]
name = "Length"
dimension = [1, 0, 0, 0, 0, 0]
kind = "length"
unit = "m"

[[alias]]
name = "Area"
dimension = [2, 0, 0, 0, 0, 0]
kind = "area"
unit = "m^2"

[[alias]]
name = "Volume"
dimension = [3, 0, 0, 0, 0, 0]
kind = "volume"
unit = "m^3"

[[alias]]
name = "Angle"
dimension = [0, 0, 0, 0, 0, 0]
kind = "angle"
unit = "rad"

[[alias]]
name = "Ratio"
dimension = [0, 0, 0, 0, 0, 0]
kind = "ratio"
unit = "1"

[[alias]]
name = "Mass"
dimension = [0, 1, 0, 0, 0, 0]
kind = "mass"
unit = "kg"

[[alias]]
name = "Density"
dimension = [-3, 1, 0, 0, 0, 0]
kind = "density"
unit = "kg·m^-3"

[[alias]]
name = "Time"
dimension = [0, 0, 1, 0, 0, 0]
kind = "time"
unit = "s"

[[alias]]
name = "Frequency"
dimension = [0, 0, -1, 0, 0, 0]
kind = "frequency"
unit = "Hz"

[[alias]]
name = "AngularVelocity"
dimension = [0, 0, -1, 0, 0, 0]
kind = "angular-velocity"
unit = "rad·s^-1"

[[alias]]
name = "AngularAcceleration"
dimension = [0, 0, -2, 0, 0, 0]
kind = "angular-acceleration"
unit = "rad·s^-2"

[[alias]]
name = "Velocity"
dimension = [1, 0, -1, 0, 0, 0]
kind = "velocity"
unit = "m·s^-1"

[[alias]]
name = "Acceleration"
dimension = [1, 0, -2, 0, 0, 0]
kind = "acceleration"
unit = "m·s^-2"

[[alias]]
name = "Force"
dimension = [1, 1, -2, 0, 0, 0]
kind = "force"
unit = "N"

[[alias]]
name = "Torque"
dimension = [2, 1, -2, 0, 0, 0]
kind = "torque"
unit = "N·m"

[[alias]]
name = "Energy"
dimension = [2, 1, -2, 0, 0, 0]
kind = "energy"
unit = "J"

[[alias]]
name = "Power"
dimension = [2, 1, -3, 0, 0, 0]
kind = "power"
unit = "W"

[[alias]]
name = "Momentum"
dimension = [1, 1, -1, 0, 0, 0]
kind = "momentum"
unit = "kg·m·s^-1"

[[alias]]
name = "Impulse"
dimension = [1, 1, -1, 0, 0, 0]
kind = "impulse"
unit = "N·s"

[[alias]]
name = "AngularMomentum"
dimension = [2, 1, -1, 0, 0, 0]
kind = "angular-momentum"
unit = "kg·m^2·s^-1"

[[alias]]
name = "MomentOfInertia"
dimension = [2, 1, 0, 0, 0, 0]
kind = "moment-of-inertia"
unit = "kg·m^2"

[[alias]]
name = "Stiffness"
dimension = [0, 1, -2, 0, 0, 0]
kind = "stiffness"
unit = "N·m^-1"

[[alias]]
name = "AngularStiffness"
dimension = [2, 1, -2, 0, 0, 0]
kind = "angular-stiffness"
unit = "N·m·rad^-1"

[[alias]]
name = "Damping"
dimension = [0, 1, -1, 0, 0, 0]
kind = "damping"
unit = "N·s·m^-1"

[[alias]]
name = "AngularDamping"
dimension = [2, 1, -1, 0, 0, 0]
kind = "angular-damping"
unit = "N·m·s·rad^-1"

[[alias]]
name = "Pressure"
dimension = [-1, 1, -2, 0, 0, 0]
kind = "pressure"
unit = "Pa"

[[alias]]
name = "Temperature"
dimension = [0, 0, 0, 1, 0, 0]
kind = "temperature"
unit = "K"

[[alias]]
name = "HeatCapacity"
dimension = [2, 1, -2, -1, 0, 0]
kind = "heat-capacity"
unit = "J·K^-1"

[[alias]]
name = "ThermalResistance"
dimension = [-2, -1, 3, 1, 0, 0]
kind = "thermal-resistance"
unit = "K·W^-1"

[[alias]]
name = "Current"
dimension = [0, 0, 0, 0, 1, 0]
kind = "current"
unit = "A"

[[alias]]
name = "Voltage"
dimension = [2, 1, -3, 0, -1, 0]
kind = "voltage"
unit = "V"

[[alias]]
name = "Resistance"
dimension = [2, 1, -3, 0, -2, 0]
kind = "resistance"
unit = "Ω"

[[alias]]
name = "Inductance"
dimension = [2, 1, -2, 0, -2, 0]
kind = "inductance"
unit = "H"

[[alias]]
name = "Charge"
dimension = [0, 0, 1, 0, 1, 0]
kind = "charge"
unit = "C"

[[alias]]
name = "TorqueConstant"
dimension = [2, 1, -2, 0, -1, 0]
kind = "torque-constant"
unit = "N·m·A^-1"

[[alias]]
name = "FrictionCoefficient"
dimension = [0, 0, 0, 0, 0, 0]
kind = "friction-coefficient"
unit = "1"
