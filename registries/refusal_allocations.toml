# FrankenRobotics refusal code allocation ledger (schema frob.refalloc/1, bead N35-33).
#
# Append-only ledger governing first-round refusal allocations across chapters,
# retired codes (never reused), documented neighbour pairs, and optional family
# holds (N35x-01). Every assignment is the deterministic output of
# `frob_core::registry::refusal_allocations::allocate_round`.
#
# Under N35-33 Rule 8 and ADR-NUM-refusal-8xx, no 8xx number is assigned in the
# first round: all 8xx requests remain `requested` with reason `owner-decision`
# (836..839 stay free for N35x-02, which then continues at FROB-REF-8100).

