meaning = "Number observed during a fast-training run (learning curve or training return) cited as evidence, or a policy trained under fast-training offered for a claim without re-evaluation under device-replay or stricter (distinct from frob-learn consumer code FROB-REF-867); pointer cited value and run or policy; observed trained_under: D4; required re-evaluation record for the same PolicyId"
