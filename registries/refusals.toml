meaning = "View is not identity (view-is-not-identity): a registered view, non-canonical JSON, or stored-view reference is offered where an identity is required; pointer is the parameter with observed view:<kind> or non-canonical-spelling; fixture crates/frob-core/tests/fixtures/workspace_refusals/ref892_view_sexp.sexp (and ref892_noncanonical.json); affected_claims filled per occurrence from the verb's declared outputs (CX-360)"
