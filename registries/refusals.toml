# FrankenRobotics refusal code registry (schema frob.refusals/1).
#
# Seeded by BD-005 with the fixed surface [exit_rule] table and core rows
# (FROB-REF-802, FROB-REF-816, FROB-REF-881). N32-REF populates the eighteen
# Tether chapter rows (FROB-REF-701..704, 720, 723..725, 801..810) plus the two
# first-round DESIGN rows (FROB-REF-726 mechanism-not-admitted, FROB-REF-990
# internal-fault) and the conflict/integrity exception lists.
#
# Held 8xx requests (N35x-01; interim = none, NOT rows of this file):
# - packet-over-byte-cap (proposed 836, exit 3, retry after-change)
# - packet-frames-not-retained (proposed 837, exit 3, retry after-change)
# - resource-read-over-cap (proposed 838, exit 3, retry after-change; repair:
#   frob artifact read <digest> --range <start>-<end>, artifact.export)
#
# Codes are sorted numerically and never reused.

schema = "frob.refusals/1"

[exit_rule]
"1xx" = 3
"2xx" = 3
"3xx" = 3
"4xx" = 3
"5xx" = 3
"6xx" = 6
"70x" = 4
"72x" = 5
"73x" = 5
"74x" = 4
"76x" = 4
"79x" = 5
"8xx" = 3
"9xx" = 9
conflict = ["FROB-REF-803", "FROB-REF-804", "FROB-REF-809"]
integrity = ["FROB-REF-810"]
capability = []

[[refusal]]
code = "FROB-REF-247"
meaning = "Determinism class not attainable on requested placement (e.g. bit-equality replay on a D3 device family, or fork on a family without a current batch-independence record); admission-time check (distinct from snapshot restore across profiles FROB-REF-894); pointer verb and placement; observed attained class and record; required class and use"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Run on a placement where the class is attained (the refusal lists them, batch-cpu first)", "If the record is stale and not absent, run frob spark check --sweeps all to make it current", "Ask for the weaker use the licence table offers (tolerance replay, paired-by-address, or unpaired comparison) by naming it in the request"]
raised_by = ["N35-04", "N35-07"]
related = ["FROB-REF-894"]

[[refusal]]
code = "FROB-REF-248"
meaning = "Solve ill-conditioned beyond precision profile (kappa_hat * u above frozen OPEN-NUM-4 limit, default 0.1) under refuse policy; run-time measurement (distinct from admission-time interface-card estimate FROB-REF-244); pointer world address and step; observed kappa_hat, lower bound kappa_hat * u, and precision profile; required kappa_hat * u <= limit"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["--precision stiff (one refinement step with a double-float residual)", "Run the world on batch-cpu in double precision or on the referee", "Soften the contact impedance or replace the near-rigid interface card", "--on-degraded continue-flagged, which keeps the world and marks it Degraded: ill-conditioned"]
raised_by = ["N21b-38", "BD-179", "N35-04", "N35-29"]
related = ["FROB-REF-244"]

[[refusal]]
code = "FROB-REF-249"
meaning = "Anchored offset left its range in one step (magnitude >= 16 m after integration) or a cell index left scene bounds; pointer world address, body and axis; observed offset or cell index; required magnitude below 16 m and index inside declared bounds"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["frob sim replay <episode> --tier batch-cpu to locate the first divergence of the blown-up world", "Reduce the step or check actuator and contact parameters (a body moving 12 m in one step is not physical)", "Enlarge the scene's declared bounds if the body legitimately left them"]
raised_by = ["N21b-37", "BD-157", "BD-179"]

[[refusal]]
code = "FROB-REF-250"
meaning = "Kernel is not dimensionally homogeneous (build time): sum of terms with different base-dimension exponent vectors or square root of an odd exponent vector (theorem card T-09); pointer kernel, statement and both exponent vectors; required equal exponent vectors"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Fix the derivation (the diagnostic names the sum)", "Declare the missing conversion constant with its dimension", "None: the check is never suppressed"]
raised_by = ["BD-018"]

[[refusal]]
code = "FROB-REF-251"
meaning = "A banned operation appears in kernel source (build time): a fast-math relaxation, a fused multiply-add (contracted or explicit), a built-in transcendental or reciprocal square root, a floating-point atomic; pointer file, line and token; observed ban category"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Replace by the admitted form: a det_* function, the split product, count then exclusive scan then write, a select, or two launches instead of a grid barrier", "Move the computation to the host if it does not belong in a batched kernel"]
raised_by = ["BD-013", "N35-18"]

[[refusal]]
code = "FROB-REF-252"
meaning = "Strict predicate in floating point without an exact form or certified guard (build time); pointer kernel and comparison; observed predicate class; required exact or guarded"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Express the predicate in the exact-integer kernel class on quantized inputs", "Use a guarded kernel: an f32 residual with a derived error bound and an exact fallback", "If the requirement allows it, declare the comparison non-strict in the requirement (recorded as a requirement change)"]
raised_by = ["BD-053"]

[[refusal]]
code = "FROB-REF-561"
meaning = "Paired statistic requested with a D4 or unrecorded arm, or paired across device families without D1, at the numerics licence check (licence::check, N35-07). On eval.compare, pairing::admit first raises FROB-REF-542 for a D4 arm, different classes, or a D3 pair lacking decision equivalence; 561 covers an unrecorded class or an exact pairing the placement cannot license. On eval.detect, 561 covers a D4 or unrecorded arm. On eval.promote, 561 covers a fast-tier result and its re-evaluation paired across device families without D1, or arms that cannot be paired. On study.compare and eval.promote the stored-result evidence boundary raises FROB-REF-825 for D4 or unrecorded evidence; Arena study::admit raises FROB-REF-533. Pointer arm; observed class/profile or both device families; required both arms D2 on one family with current batch-independence record, D1 across families, or D3 with decision-equivalence record"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Re-evaluate the offending arm under device-replay or stricter", "Run both arms on one device family, or on batch-cpu", "Request the comparison as unpaired, with the larger sample that needs", "Under class D3 with a recorded decision-level equivalence, request paired-by-address"]
raised_by = ["N35-07", "BD-269", "BD-262"]
related = ["FROB-REF-533", "FROB-REF-542", "FROB-REF-825"]

[[refusal]]
code = "FROB-REF-562"
meaning = "Attribution or counterfactual fork requested below class D2 (source run class D3, D4 or unrecorded, or device family batch-independence record not current) at fork or re-run admission (distinct from attribution-time fork-set failure FROB-REF-584); pointer source run; observed class and record age; required D2 with GATE-SPARK-15 current for the family"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Teleport the world to batch-cpu and fork there", "Re-run the episode under device-replay on a family with a current record", "frob spark check --sweeps all to renew the record"]
raised_by = ["N35-07", "BD-269", "BD-205"]
related = ["FROB-REF-584"]

