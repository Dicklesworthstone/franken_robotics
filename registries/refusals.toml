raised_by = ["N35-06", "BD-269"]
related = ["FROB-REF-867"]

[[refusal]]
code = "FROB-REF-862"
meaning = "Performance figure without a complete disclosure block. Triggers: (1) required field absent; (2) na used where applicability table forbids it; (3) energy is zero instead of a value or named gap; (4) step rate without its decimation; (5) stale fingerprint digest; (6) ratio block without comparator revision or fewer than ten pairs; (7) parity-defect field missing while a defect is open. Interim trigger: rates violate unit ordering raised with detail = \"rates-violate-unit-ordering\" and pointer rates.ordering (N36-REF ledger request rates-violate-unit-ordering). Pointer first missing or inadmissible field inside the figure's block; observed missing/inadmissible fields by name; required complete block"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Re-run through the performance harness, which fills the block from the run's receipts", "Supply the named fields from the run's receipt", "Present the figure as context without the Performance claim"]
raised_by = ["BD-216", "N36-13", "N36-REF"]

[[refusal]]
code = "FROB-REF-863"
meaning = "Performance ratio without a paired lower bound. Triggers: (1) ratio stated with no campaign; (2) campaign of fewer than ten pairs; (3) arms whose units or decimations are not comparable; (4) void campaign where an arm failed; (5) threshold judged on mean instead of bound. Pointer ratio field; observed pair count and whether a bound was computed; required at least ten pairs and the one-sided 95% bound exp(l_bar - t * s / sqrt(n))"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Run a paired campaign of at least ten pairs, the two arms of each pair back to back in randomized order on one host state, and report the bound", "State the two rates separately, without a ratio", "Cite the figures as context with no claim"]
raised_by = ["BD-216", "N36-06", "N36-REF"]

[[refusal]]
code = "FROB-REF-864"
meaning = "Device result cited without a current CPU-versus-device check for its kernels on that device family, driver and compiler (distinct from run-time refusal FROB-REF-605 which refuses to run on the device); pointer result; observed stale or missing check rows with fingerprint digests; required current check for every kernel in the step plan"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["frob spark check on that family", "frob spark fingerprint first if the fingerprint changed", "Cite the batch-cpu result"]
raised_by = ["N35-07", "BD-176"]
related = ["FROB-REF-605"]

[[refusal]]
code = "FROB-REF-865"
meaning = "Summary statistic that omits what it excluded (worlds marked Degraded or Faulted, unscored pairs, masked samples); pointer statistic; observed inputs counted against denominator; required excluded table with counts by reason"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Regenerate through frob telemetry summary, which states exclusions", "Add the counts by reason and the denominator"]
raised_by = ["N35-28"]

[[refusal]]
code = "FROB-REF-866"
meaning = "Speed experiment requested without its computed ceiling, or with a ceiling below its goal. Triggers: (1) campaign of kind optimization or speed-experiment with no ceiling record; (2) ceiling filed after first measurement; (3) ceiling computed on cold or uncached baseline; (4) ceiling below goal; (5) pilot whose falsifier is a speed ratio with no ceiling. Pointer experiment's ceiling field, or goal field when ceiling is below it; observed ceiling (absent or value, when, baseline) and goal; required ceiling present, filed before first measurement, computed on warm cached baseline, and at least the goal"
defined_in = "§35.11"
exit = 3
retry = "after-change"
repairs = ["Compute the ceiling from the current phase profile and attach it (removing a phase of share f gives at most 1/(1 - f))", "Lower the goal to at most the ceiling", "Choose another lever: a target holding a larger share of the baseline", "Fund the work for a reason other than speed, in writing, with no speed figure; failing that, do not run the experiment"]
raised_by = ["BD-354", "N35-05", "N36-05", "N36-REF"]

[[refusal]]
code = "FROB-REF-881"
meaning = "Evidence or a certificate establishes a different quantifier prefix than the query's, including clairvoyant evidence offered for a robust claim"
