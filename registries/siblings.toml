# Sibling repository register (schema frob.siblings/1).
#
# Shared between the suite survey (N33c-07, owning the survey columns) and the
# suite deny rules in `xtask check-deps` (N33c-09, owning the policy columns:
# posture, cargo, allowed_in, forbidden_features, reason, fallback).
#
# Written strictly inside the `frob-core::registry::toml` subset (N34p2-01):
# UTF-8, LF, basic strings only, homogeneous arrays, single-line inline tables
# without trailing commas, no dotted keys on the left of `=`.

schema = "frob.siblings/1"

