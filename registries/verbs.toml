# FrankenRobotics verb registry (schema frob.verbs/1).
#
# Starts schema-valid and empty at the first commit (BD-002).
# Rows arrive with the VERBS-<cluster> registry beads and frob-verbs.
# Written strictly in the frob-core::registry::toml subset (N34p2-01).

schema = "frob.verbs/1"

[[retired_name]]
name = "autopsy.fork"
use = ["run.fork"]
reason = "The replay chapter owns forks and their classification."

[[retired_name]]
name = "autopsy.diverge"
use = ["telemetry.divergence"]
reason = "Telemetry owns the first divergence between two runs."

[[retired_name]]
name = "autopsy.interventions"
use = ["autopsy.intervene", "autopsy.attribute"]
reason = "Autopsy registers intervention and attribution as separate verbs."

[[retired_name]]
name = "eval.audit"
use = ["nemesis.audit"]
reason = "Nemesis owns the screening audit."

[[retired_name]]
name = "eval.rankcheck"
use = ["fidelity.modelform", "eval.rank-agreement"]
reason = "Fidelity owns the model-form rank check and eval owns agreement across rungs or tiers."

[[retired_name]]
name = "fidelity.rank"
use = ["eval.rank-agreement"]
reason = "The rank-agreement record accepts a tier pair."

[[retired_name]]
name = "nemesis.show"
use = ["nemesis.hardset"]
reason = "The default hardset action reads the hard-world set."

[[retired_name]]
name = "cert.bundle"
use = ["prove.bundle"]
reason = "The proof chapter owns certificate bundles."

[[retired_name]]
name = "ground.import"
use = ["ground.ingest"]
reason = "Ground calibration registers data ingestion as ground.ingest."

[[retired_name]]
name = "foundry.structure"
use = ["foundry.size", "foundry.optimize", "foundry.check"]
reason = "Foundry registers sizing, optimization, and checking as separate verbs."

[[retired_name]]
name = "policy.rs"
use = []
reason = "This is a source filename."

[[retired_name]]
name = "contact.rs"
use = []
reason = "This is a source filename."

[[verb]]
name = "doctor"
cluster = "operator"
kind = "read"
tier = "S"
capabilities = []
public = true
input_schema = "frob.doctor.in/1"
output_schema = "frob.doctor.out/1"
refusals = []
idempotent = true
cost_model = "static: read compiled stack identity"
first_milestone = "M0"
task_clusters = ["orient"]
examples = ["frob doctor --json"]
purpose = "Operator verb: check toolchains, foundation pins, devices, kernel caches and probe status"
use_when = "Inspecting the installation and its stack identity."
owner = "frob-verbs"

[[verb]]
name = "capabilities"
cluster = "operator"
kind = "read"
tier = "S"
capabilities = []
public = true
input_schema = "frob.capabilities.in/1"
output_schema = "frob.capabilities.out/1"
refusals = []
idempotent = true
cost_model = "static: one pass over the verb registry"
first_milestone = "M0"
task_clusters = ["orient"]
examples = ["frob capabilities --json"]
purpose = "Operator verb: what is implemented and what is not, with resolved modes and ceilings per device"
use_when = "Checking which verb handlers are present and what has been qualified."
owner = "frob-verbs"
paginated = true

[[verb]]
name = "robot-docs"
cluster = "operator"
kind = "read"
tier = "S"
capabilities = []
public = true
input_schema = "frob.robot-docs.in/1"
output_schema = "frob.robot-docs.out/1"
refusals = []
idempotent = true
cost_model = "static: one pass over the verb registry"
first_milestone = "M0"
task_clusters = ["orient"]
