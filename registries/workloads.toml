decimation = "4/1"
iterations = 8
source = "Plan §36.3 rows 3 & 9, Appendix H.3: Isaac Lab 3.0.0 G1 humanoid rough-terrain configuration at tag v3.0.0 (https://arxiv.org/abs/2511.04831, dt = 5 ms, decimation = 4, 8 TGS position iterations, to-re-read at pinned commit)"

