# FrankenRobotics reference workloads and comparator step settings (schema frob.workload/1).
#
# Owned by frob-core (`frob_core::perf::workload`, N36-02) and linted on top of that
# single parser by frob-conformance (`frob_conformance::perf::workloads`).
#
# Reference workloads Q and H are DESIGN defaults (capacities frozen at M2 under
# OPEN-SPARK-3; physics step h = 2 ms subject to OPEN-PERF-4 / N36-26).
# Row capacity rule (KA-815): row_cap(C, actuated) = round_up(4*C + 2*actuated, 8).
#   - Q: 4*32 + 2*12 = 152 -> rule 152, raised to 160 by explicit row_cap_override.
#   - H: 4*64 + 2*29 = 314 -> rule 320, no override.
#
# Written strictly in the frob-core::registry::toml subset (N34p2-01): UTF-8, LF,
# basic double-quoted strings only, homogeneous arrays, single-line inline tables
# without trailing commas, and no dotted keys on the left of `=`.

schema = "frob.workload/1"

[workload.Q]
robot = "ref-quadruped-12"
actuated = 12
dof = 18
bodies = 13
foot_samples = 16
contact_cap = 32
row_cap = 160
row_cap_override = { rule = 152, reason = "raised to the next multiple of the execution width 32 (reference-workload decision; OPEN-SPARK-3)" }
h_s = "1/500"
newton_iterations = 4
warm_start = true
decimation = "10/1"
worlds = 8192
grounds = ["flat", "rough"]
status = "default"

[workload.H]
robot = "ref-humanoid-29"
actuated = 29
dof = 35
bodies = 30
contact_cap = 64
row_cap = 320
h_s = "1/500"
newton_iterations = 4
warm_start = true
decimation = "10/1"
worlds = 8192
grounds = ["flat", "heightfield"]
status = "default"

# ============================================================================
# Comparator step settings (matched and native) for the parity baseline
# (N36-02, BD-039, N36-25, §36.2, §36.3, Appendix H).
#
# Each incumbent arm carries two setting records per reference workload:
#   - `matched`: our h = 1/500 s, decimation = 10/1, 4 solver iterations where
#     admitted (with `difference` in writing where the incumbent solver differs).
#   - `native`: the incumbent's own recommended step for the task, with `source`.
# ============================================================================

# --- mujoco-warp (MuJoCo Warp 4.0.1 / mjlab) ---

[[setting]]
comparator = "mujoco-warp"
workload = "Q"
kind = "matched"
h_s = "1/500"
decimation = "10/1"
iterations = 4

[[setting]]
comparator = "mujoco-warp"
workload = "Q"
kind = "native"
h_s = "1/200"
decimation = "4/1"
iterations = 4
source = "Plan §36.2, §36.3 row 1, Appendix H.3: mjlab nightly benchmark on MuJoCo Warp 4.0.1 (https://mujocolab.github.io/mjlab/nightly/, quadruped velocity task, d = 4 at 50 Hz control, to-re-read at pinned commit)"

[[setting]]
comparator = "mujoco-warp"
workload = "H"
kind = "matched"
h_s = "1/500"
decimation = "10/1"
iterations = 4

[[setting]]
comparator = "mujoco-warp"
workload = "H"
kind = "native"
h_s = "1/500"
decimation = "10/1"
iterations = 4
source = "Plan §36.3 rows 7-8, Appendix H.3: MuJoCo Warp 4.0.1 nightly humanoid (G1) benchmark at 8192 worlds (h = 2 ms, d = 10, to-re-read at pinned commit)"

