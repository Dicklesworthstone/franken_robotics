# --- isaac-lab (Isaac Lab 3.0.0 on Isaac Sim 6.2.0 / PhysX or Newton) ---

[[setting]]
comparator = "isaac-lab"
workload = "Q"
kind = "matched"
h_s = "1/500"
decimation = "10/1"
iterations = 4
difference = "When run on the PhysX GPU backend, Isaac Lab uses PhysX TGS position/velocity solver iterations rather than fixed lockstep convex Newton iterations; the matched run sets h = 1/500 s, d = 10, and 4 position iterations."

[[setting]]
comparator = "isaac-lab"
workload = "Q"
kind = "native"
h_s = "1/200"
decimation = "4/1"
iterations = 4
source = "Plan §36.3 row 3, Appendix H.3: Isaac Lab 3.0.0 release notes and benchmark configs (https://arxiv.org/abs/2511.04831, default quadruped locomotion dt = 5 ms, decimation = 4, 50 Hz control, to-re-read at tag v3.0.0)"

[[setting]]
comparator = "isaac-lab"
workload = "H"
kind = "matched"
h_s = "1/500"
decimation = "10/1"
iterations = 4
difference = "When run on the PhysX GPU backend, Isaac Lab uses PhysX TGS position/velocity solver iterations rather than fixed lockstep convex Newton iterations; the matched run sets h = 1/500 s, d = 10, and 4 position iterations."

[[setting]]
